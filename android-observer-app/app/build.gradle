plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flexhrm.observer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.flexhrm.observer'
        minSdk 24
        targetSdk 35
        versionCode 8
        versionName '1.0.8'

        buildConfigField 'String', 'OBSERVER_URL',
                '"https://appassets.androidplatform.net/observer/login"'
        buildConfigField 'String', 'API_ORIGIN',
                "\"${project.findProperty('API_ORIGIN') ?: 'https://mediumseagreen-chimpanzee-998149.hostingersite.com'}\""
        buildConfigField 'String', 'API_BASE',
                "\"${project.findProperty('API_ORIGIN') ?: 'https://mediumseagreen-chimpanzee-998149.hostingersite.com'}/api\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (project.hasProperty('FLEXHRM_RELEASE_STORE_FILE')) {
                storeFile file(FLEXHRM_RELEASE_STORE_FILE)
                storePassword FLEXHRM_RELEASE_STORE_PASSWORD
                keyAlias FLEXHRM_RELEASE_KEY_ALIAS
                keyPassword FLEXHRM_RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty('FLEXHRM_RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            } else {
                // Local sideload builds: sign with the debug keystore so the APK installs.
                signingConfig signingConfigs.debug
            }
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.webkit:webkit:1.12.1'
}
