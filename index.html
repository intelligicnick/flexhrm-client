<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <style>
      #root:empty {
        display: flex;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        background: #f1f5f9;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      #root:empty::after {
        content: "";
        width: 2rem;
        height: 2rem;
        border: 2px solid #ff791a;
        border-top-color: transparent;
        border-radius: 9999px;
        animation: flexhrm-spin 0.8s linear infinite;
      }
      @keyframes flexhrm-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <title>Flex HRM an Intelligic product</title>
    <script>
      (function () {
        try {
          if (navigator.serviceWorker && !location.pathname.startsWith("/supervisor")) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (reg) { reg.unregister(); });
            }).catch(function () {});
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          var bridge = window.FlexHrmAndroid || window.Android;
          if (!bridge || !bridge.getSupervisorSession) return;
          var raw = bridge.getSupervisorSession();
          if (!raw) return;
          var session = JSON.parse(raw);
          if (!session || !session.token) return;
          localStorage.setItem("hrms_supervisor_token", session.token);
          if (session.name) localStorage.setItem("hrms_supervisor_name", session.name);
          if (session.supervisorId) localStorage.setItem("hrms_supervisor_id", session.supervisorId);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
