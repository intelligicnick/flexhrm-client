<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet" />
    <title>Flex HRM an Intelligic product</title>
    <script src="/extension-error-guard.js"></script>
    <script>
      (function () {
        try {
          if (navigator.serviceWorker && !location.pathname.startsWith("/supervisor")) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (reg) { reg.unregister(); });
            }).catch(function () {});
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          var bridge = window.FlexHrmAndroid || window.Android;
          if (!bridge || !bridge.getSupervisorSession) return;
          var raw = bridge.getSupervisorSession();
          if (!raw) return;
          var session = JSON.parse(raw);
          if (!session || !session.token) return;
          localStorage.setItem("hrms_supervisor_token", session.token);
          if (session.name) localStorage.setItem("hrms_supervisor_name", session.name);
          if (session.supervisorId) localStorage.setItem("hrms_supervisor_id", session.supervisorId);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
