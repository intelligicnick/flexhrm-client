plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flexhrm.supervisor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.flexhrm.supervisor'
        minSdk 24
        targetSdk 35
        versionCode 18
        versionName '1.7.2'

        buildConfigField 'String', 'SUPERVISOR_URL',
                '"https://appassets.androidplatform.net/supervisor/login"'
        buildConfigField 'String', 'API_ORIGIN',
                "\"${project.findProperty('API_ORIGIN') ?: 'https://mediumseagreen-chimpanzee-998149.hostingersite.com'}\""
        buildConfigField 'String', 'API_BASE',
                "\"${project.findProperty('API_ORIGIN') ?: 'https://mediumseagreen-chimpanzee-998149.hostingersite.com'}/api\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
