<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flex HRM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8fafc; color: #1e293b; padding: 28px; }
    body.connected-only { padding: 20px; }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { font-size: 12px; color: #64748b; margin-bottom: 20px; }
    label { display: block; font-size: 11px; font-weight: 600; color: #475569; margin-bottom: 4px; margin-top: 12px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 13px; }
    button { padding: 11px 14px; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-primary { width: 100%; margin-top: 20px; background: #ff791a; color: white; }
    .btn-primary:hover { background: #e66d17; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-danger { background: #fee2e2; color: #b91c1c; width: 100%; }
    .btn-danger:hover { background: #fecaca; }
    .error { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; padding: 10px; border-radius: 8px; font-size: 12px; margin-top: 12px; display: none; }
    .success { background: #ecfdf5; border: 1px solid #a7f3d0; color: #047857; padding: 10px; border-radius: 8px; font-size: 12px; margin-top: 12px; display: none; }
    .hint { font-size: 10px; color: #64748b; margin-top: 4px; line-height: 1.4; }
    .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .row button { width: auto; margin-top: 0; }
    .connected-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 18px 16px;
      margin-bottom: 12px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: #0f172a;
    }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; margin-right: 8px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <h1 id="page-title">Flex HRM</h1>
  <p class="subtitle" id="page-subtitle">Device connection</p>

  <div id="connected-view" class="hidden">
    <div class="connected-card">
      <span class="status-dot"></span>Connected
    </div>
    <button type="button" class="btn-danger" id="revoke-btn">Revoke</button>
  </div>

  <form id="setup-form" class="hidden">
    <label for="apiBaseUrl">Server URL</label>
    <input id="apiBaseUrl" type="url" placeholder="http://192.168.1.10:3001" required />
    <p class="hint">API address (port 3001). Use your server IP if this is a different PC.</p>
    <div class="row">
      <button type="button" class="btn-secondary" id="test-btn">Test Connection</button>
      <button type="button" class="btn-secondary hidden" id="cancel-btn">Cancel</button>
    </div>

    <label for="companyKey">Connection Key</label>
    <input id="companyKey" type="text" placeholder="FHRM-XXXXXXXX" required />

    <label for="monitorHash">Connection Hash</label>
    <input id="monitorHash" type="text" placeholder="FHSH-XXXXXXXXXXXX" required />

    <p class="hint">Each employee has unique credentials from the Flex HRM monitor dashboard. No employee code is needed.</p>

    <label for="deviceName">Device Name</label>
    <input id="deviceName" type="text" placeholder="Office Laptop" required />

    <label class="consent-row" style="display:flex;align-items:flex-start;gap:8px;margin-top:16px;font-size:12px;font-weight:400;color:#475569;">
      <input id="consentAccepted" type="checkbox" required style="width:auto;margin-top:2px;" />
      <span>I consent to activity monitoring on this device as configured by my organization.</span>
    </label>

    <button type="submit" class="btn-primary" id="submit-btn">Connect</button>
  </form>

  <div id="error" class="error"></div>
  <div id="success" class="success"></div>

  <script>
    const connectedView = document.getElementById('connected-view');
    const form = document.getElementById('setup-form');
    const errorEl = document.getElementById('error');
    const successEl = document.getElementById('success');
    const pageTitle = document.getElementById('page-title');
    const pageSubtitle = document.getElementById('page-subtitle');
    const cancelBtn = document.getElementById('cancel-btn');
    const submitBtn = document.getElementById('submit-btn');
    let deviceInfo = {};
    let isConnected = false;

    function hideMessages() {
      errorEl.style.display = 'none';
      successEl.style.display = 'none';
    }

    function showError(message) {
      errorEl.textContent = message;
      errorEl.style.display = 'block';
    }

    function showSuccess(message) {
      successEl.textContent = message;
      successEl.style.display = 'block';
    }

    function fillForm(config) {
      document.getElementById('apiBaseUrl').value = config.apiBaseUrl || '';
      document.getElementById('companyKey').value = config.companyKey || '';
      document.getElementById('monitorHash').value = config.monitorHash || '';
      document.getElementById('deviceName').value = config.deviceName || '';
    }

    function showConnectedView() {
      isConnected = true;
      document.body.classList.add('connected-only');
      pageTitle.classList.add('hidden');
      pageSubtitle.classList.add('hidden');
      connectedView.classList.remove('hidden');
      form.classList.add('hidden');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Save Changes';
      hideMessages();
    }

    function showSetupView(editing = false) {
      isConnected = false;
      document.body.classList.remove('connected-only');
      pageTitle.classList.remove('hidden');
      pageSubtitle.classList.remove('hidden');
      connectedView.classList.add('hidden');
      form.classList.remove('hidden');
      pageSubtitle.textContent = editing ? 'Update connection details.' : 'Link this device to your workspace.';
      cancelBtn.classList.toggle('hidden', !editing);
      submitBtn.textContent = editing ? 'Save Changes' : 'Connect';
      hideMessages();
    }

    window.flexAgent.getDeviceInfo().then((info) => {
      deviceInfo = info;
      if (!document.getElementById('deviceName').value) {
        document.getElementById('deviceName').value = info.domainName || '';
      }
    });

    document.getElementById('test-btn').addEventListener('click', async () => {
      hideMessages();
      const btn = document.getElementById('test-btn');
      btn.disabled = true;
      btn.textContent = 'Testing...';
      try {
        const result = await window.flexAgent.testConnection(document.getElementById('apiBaseUrl').value);
        showSuccess(`Connected to ${result.url}`);
      } catch (err) {
        showError(err.message || 'Connection failed');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Test Connection';
      }
    });

    cancelBtn.addEventListener('click', async () => {
      const config = await window.flexAgent.getConfig();
      if (config?.authToken) showConnectedView();
    });

    document.getElementById('revoke-btn').addEventListener('click', async () => {
      if (!confirm('Revoke this device connection?')) return;
      hideMessages();
      const btn = document.getElementById('revoke-btn');
      btn.disabled = true;
      try {
        await window.flexAgent.revoke();
        form.reset();
        if (deviceInfo.domainName) {
          document.getElementById('deviceName').value = deviceInfo.domainName;
        }
        showSetupView(false);
        showSuccess('Connection revoked.');
      } catch (err) {
        showError(err.message || 'Could not revoke connection');
      } finally {
        btn.disabled = false;
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();
      submitBtn.disabled = true;
      submitBtn.textContent = isConnected ? 'Saving...' : 'Connecting...';

      try {
        const consentAccepted = document.getElementById('consentAccepted').checked;
        if (!consentAccepted) {
          showError('Please accept the monitoring consent to continue.');
          submitBtn.disabled = false;
          submitBtn.textContent = isConnected ? 'Save Changes' : 'Connect';
          return;
        }
        await window.flexAgent.register({
          apiBaseUrl: document.getElementById('apiBaseUrl').value.replace(/\/$/, ''),
          companyKey: document.getElementById('companyKey').value.trim(),
          monitorHash: document.getElementById('monitorHash').value.trim(),
          deviceName: document.getElementById('deviceName').value.trim(),
          ...deviceInfo,
          consentAccepted,
        });
        showConnectedView();
      } catch (err) {
        showError(err.message || 'Connection failed');
        submitBtn.disabled = false;
        submitBtn.textContent = isConnected ? 'Save Changes' : 'Connect';
      }
    });

    window.flexAgent.getConfig().then((config) => {
      if (config?.authToken) {
        showConnectedView();
      } else {
        showSetupView(false);
      }
    });
  </script>
</body>
</html>
